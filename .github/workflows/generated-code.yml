name: Generated code

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-packages:
    name: Generated ${{ matrix.architecture }} (${{ matrix.profile }}) packages
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        architecture: [mvvm, mvi, viper, vip, mvp]
        profile: [default]
        include:
          - architecture: mvvm
            profile: advanced
          - architecture: mvi
            profile: advanced
    env:
      # Xcode 26.2 includes Swift 6.2 and is installed on macos-15 runners.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Generate Version
        run: make generate-version
      - name: Test Forge
        run: |
          if swift test --jobs 4 > "$RUNNER_TEMP/forge-swift-test.log" 2>&1; then
            grep -E "Test Suite 'All tests'|Executed [0-9]+ tests" "$RUNNER_TEMP/forge-swift-test.log" | tail -2
          else
            grep -nE 'error:|failed|Failure|Executed [0-9]+ tests' "$RUNNER_TEMP/forge-swift-test.log" | tail -40 || true
            tail -100 "$RUNNER_TEMP/forge-swift-test.log"
            exit 1
          fi
      - name: Build generated packages and run their tests
        shell: bash
        run: |
          options=()
          if [[ "${{ matrix.profile }}" == "advanced" ]]; then
            options+=(--binding concurrency --testing swift-testing --di factory)
          fi
          python3 Scripts/verify-generated.py --architecture "${{ matrix.architecture }}" --jobs 4 "${options[@]}"

  xcode-smoke:
    name: Generated Xcode app and tests
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build Forge
        run: |
          make generate-version
          swift build --jobs 4
      - name: Run generated XCTest and Swift Testing suites
        shell: bash
        run: |
          sdk_version=$(xcrun --sdk iphonesimulator --show-sdk-version)
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${sdk_version//./-}"
          devices=$(xcrun simctl list devices available --json)
          if ! simulator_id=$(jq -er --arg runtime "$runtime" '
            first(.devices[$runtime][] | select(.isAvailable and (.name | startswith("iPhone"))) | .udid)
          ' <<< "$devices"); then
            echo "::error::No available iPhone simulator for iOS $sdk_version"
            echo "$devices"
            exit 1
          fi
          xcrun simctl bootstatus "$simulator_id" -b
          bin_path=$(swift build --show-bin-path)
          python3 Scripts/xcode-smoke.py --forge "$bin_path/forge" \
            --destination "platform=iOS Simulator,id=$simulator_id"
